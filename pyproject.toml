[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wmroute"
version = "0.1.0"
description = "Paired exact-reset evaluation and routing utilities for Medium-to-Full world-model cascades"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Malo de Pastor", email = "depastorm@gmail.com"}]
dependencies = ["numpy>=1.24"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["matplotlib>=3.7", "pandas>=2.0", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
